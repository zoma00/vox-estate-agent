name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/realestate_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (TTS engine)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Lint (ruff)
        working-directory: .
        run: ruff check backend/realestate_agent/app backend/realestate_agent/tests

      - name: Test (pytest)
        run: pytest tests/ -v
        env:
          OPENAI_API_KEY: ci-test-key-not-real
