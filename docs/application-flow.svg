<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 990" role="img" aria-labelledby="title desc">
  <title id="title">Vox Estate Agent application flow</title>
  <desc id="desc">A user interacts with the React single-page application. Chat and voice requests are validated by the FastAPI API. Chat requests use the OpenAI API and can pass the response through gTTS speech generation. Generated audio files are served from the static audio route, and text and audio URLs return to the React interface for display and playback.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 28px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #c4b5fd; }
      .label { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .copy { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .pill { font-size: 14px; font-weight: 700; fill: #4c1d95; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="720" height="990" rx="24" fill="#f8fafc"/>

  <rect x="20" y="20" width="680" height="94" rx="18" fill="#312e81"/>
  <text x="360" y="59" text-anchor="middle" class="heading">Vox Estate Agent</text>
  <text x="360" y="88" text-anchor="middle" class="subtitle">React, FastAPI, AI chat, and text-to-speech flow</text>

  <rect x="170" y="142" width="380" height="82" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="360" y="176" text-anchor="middle" class="label">User Browser</text>
  <text x="360" y="202" text-anchor="middle" class="copy">Chat input, navigation, and audio playback</text>

  <path d="M360 224 L360 260" class="arrow"/>

  <rect x="40" y="262" width="640" height="116" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="297" text-anchor="middle" class="label">React Single-Page Application</text>
  <text x="360" y="326" text-anchor="middle" class="copy">SpeakChat · gallery · registration · admin dashboard</text>
  <rect x="134" y="343" width="452" height="25" rx="12" fill="#ddd6fe"/>
  <text x="360" y="361" text-anchor="middle" class="pill">Axios requests and React Router interfaces</text>

  <path d="M360 378 L360 415" class="arrow"/>

  <rect x="40" y="417" width="640" height="130" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="360" y="452" text-anchor="middle" class="label">FastAPI REST API</text>
  <text x="360" y="481" text-anchor="middle" class="copy">CORS middleware · Pydantic request validation · error handling</text>
  <text x="360" y="510" text-anchor="middle" class="small">POST /api/chat · POST /api/tts · GET /api/languages</text>
  <text x="360" y="534" text-anchor="middle" class="small">Chat requests can generate both an AI answer and speech audio</text>

  <path d="M245 547 L245 588" class="arrow"/>
  <path d="M475 547 L475 588" class="arrow"/>

  <rect x="40" y="590" width="310" height="156" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="195" y="625" text-anchor="middle" class="label">AI Chat Pipeline</text>
  <text x="195" y="654" text-anchor="middle" class="copy">Real-estate system prompt</text>
  <text x="195" y="680" text-anchor="middle" class="copy">Configurable model and parameters</text>
  <line x1="68" y1="700" x2="322" y2="700" stroke="#a7f3d0" stroke-width="2"/>
  <text x="195" y="729" text-anchor="middle" class="small">OpenAI Chat Completions API</text>

  <rect x="370" y="590" width="310" height="156" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="525" y="625" text-anchor="middle" class="label">TTS Pipeline</text>
  <text x="525" y="654" text-anchor="middle" class="copy">AI response or direct text input</text>
  <text x="525" y="680" text-anchor="middle" class="copy">Language and voice parameters</text>
  <line x1="398" y1="700" x2="652" y2="700" stroke="#fed7aa" stroke-width="2"/>
  <text x="525" y="729" text-anchor="middle" class="small">gTTS speech generation</text>

  <path d="M195 746 L195 778 L325 778 L325 800" class="arrow"/>
  <path d="M525 746 L525 778 L395 778 L395 800" class="arrow"/>

  <rect x="40" y="802" width="640" height="102" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="839" text-anchor="middle" class="label">Response &amp; Audio Delivery</text>
  <text x="360" y="868" text-anchor="middle" class="copy">JSON response text, extracted URLs, and optional audio URL</text>
  <text x="360" y="892" text-anchor="middle" class="small">Generated WAV files served from /static/audio/{filename}</text>

  <path d="M360 904 L360 934" class="arrow"/>

  <rect x="150" y="936" width="420" height="40" rx="20" fill="#0f172a"/>
  <text x="360" y="962" text-anchor="middle" class="subtitle">React renders the reply and plays the audio</text>
</svg>
